<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>趣味知识答题</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #7b6cf0 0%, #6151dd 100%);
    color: #222;
    min-height: 100%;
  }
  #card { min-height: 100%; }
  .start { position: fixed; inset: 0; }
  .start-bg-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .start-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: flex-end; justify-content: center;
    padding: 0 20px 16%;
  }
  .start-btn {
    padding: 20px 46px;
    font-size: 22px; font-weight: 900; letter-spacing: 1px;
    color: #fff;
    background: linear-gradient(135deg, #8a7cf2, #6a5ae2);
    border: none; border-radius: 999px;
    box-shadow: 0 8px 0 #4e3fc0, 0 18px 28px rgba(78,63,192,0.45);
    cursor: pointer;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .start-btn:active {
    transform: translateY(6px);
    box-shadow: 0 2px 0 #4e3fc0, 0 6px 12px rgba(78,63,192,0.4);
  }
  .q-screen {
    position: relative; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 70px 20px 40px; overflow: hidden;
  }
  .cf { position: absolute; z-index: 0; }
  .cf1 { top: 12%; left: 14%; width: 16px; height: 16px; background: #8fd36a; border-radius: 4px; transform: rotate(20deg); }
  .cf2 { top: 8%; right: 18%; width: 14px; height: 14px; background: #f45b8a; border-radius: 4px; transform: rotate(-15deg); }
  .cf3 { top: 30%; left: 7%; width: 18px; height: 18px; background: #ffd34d; border-radius: 5px; transform: rotate(30deg); }
  .cf4 { top: 24%; right: 8%; width: 16px; height: 16px; background: #5ac8f5; border-radius: 50%; }
  .cf5 { bottom: 18%; left: 10%; width: 16px; height: 16px; background: #ffd34d; border-radius: 4px; transform: rotate(18deg); }
  .cf6 { bottom: 13%; left: 20%; width: 14px; height: 14px; background: #f45b8a; border-radius: 50%; }
  .cf7 { top: 46%; right: 6%; width: 14px; height: 14px; background: #f45b8a; border-radius: 50%; }
  .cf8 { bottom: 24%; right: 8%; width: 16px; height: 16px; background: #8fd36a; border-radius: 4px; transform: rotate(-20deg); }
  .card-wrap { position: relative; z-index: 2; width: 100%; max-width: 420px; }
  .avatar-ring {
    position: absolute; top: -52px; left: 50%; transform: translateX(-50%);
    width: 104px; height: 104px; border-radius: 50%;
    background: #fff; padding: 5px;
    box-shadow: 0 8px 20px rgba(60,40,140,0.3);
    z-index: 3;
  }
  .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #fff; display: block; }
  .card { background: #fff; border-radius: 30px; padding: 72px 24px 28px; box-shadow: 0 20px 50px rgba(50,30,120,0.3); }
  .progress { text-align: center; font-size: 15px; font-weight: 800; color: #7a6cf0; margin-bottom: 18px; }
  .question { text-align: center; font-size: 25px; font-weight: 900; line-height: 1.4; color: #1f2330; margin-bottom: 26px; }
  .hint { text-align: center; font-size: 13px; color: #9a9ab0; margin: -16px 0 18px; }
  .options { display: flex; flex-direction: column; gap: 14px; }
  .option {
    width: 100%; padding: 18px; border: none; border-radius: 999px;
    background: #f3f3f8; color: #1f2330;
    font-size: 17px; font-weight: 700; text-align: center;
    cursor: pointer; box-shadow: 0 3px 10px rgba(80,60,160,0.08);
    transition: all 0.15s ease;
  }
  .option:active { transform: scale(0.99); }
  .option.selected { background: linear-gradient(135deg, #8a7cf2, #6a5ae2); color: #fff; }
  .option.correct { background: linear-gradient(135deg, #43d17a, #24b862); color: #fff; }
  .option.wrong { background: linear-gradient(135deg, #ff7a7a, #f04a4a); color: #fff; }
  .option.disabled { pointer-events: none; }
  .tip { text-align: center; min-height: 22px; margin-top: 16px; font-size: 15px; font-weight: 800; color: #6a5ae2; }
  .submit-btn {
    margin-top: 20px; width: 100%; padding: 17px; border: none; border-radius: 999px;
    font-size: 18px; font-weight: 900; color: #fff;
    background: linear-gradient(135deg, #8a7cf2, #6a5ae2);
    cursor: pointer; box-shadow: 0 10px 22px rgba(106,90,226,0.4);
  }
  .submit-btn:active { transform: translateY(2px); }
  .nav { margin-top: 16px; display: flex; align-items: center; justify-content: space-between; }
  .nav-btn { border: none; cursor: pointer; font-weight: 900; }
  .nav-btn.back { background: transparent; color: #7a6cf0; font-size: 16px; padding: 10px 4px; }
  .nav-btn.next {
    background: linear-gradient(135deg, #8a7cf2, #6a5ae2); color: #fff;
    font-size: 17px; padding: 14px 30px; border-radius: 999px;
    box-shadow: 0 8px 20px rgba(106,90,226,0.4);
  }
  .nav-btn.next:active { transform: translateY(2px); }
  .clue { position: relative; z-index: 2; text-align: center; padding: 40px 24px; }
  .clue .emoji { font-size: 50px; margin-bottom: 12px; }
  .clue h2 { font-size: 22px; margin-bottom: 20px; color: #fff; }
  .clue-img {
    width: 100%; max-width: 360px; border-radius: 20px;
    display: block; margin: 0 auto;
    box-shadow: 0 16px 40px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>
  <div id="card"></div>

  <script>
    // ===== 题库（answer=单选正确项；answers=多选正确项数组；anyCorrect=选啥都对）=====
    const QUESTIONS = [
      { q: "你最高的爬升记录是多少？", options: ["865 米", "1367 米", "1980 米", "2450 米"], answer: 1 },
      { q: "你最爱吃的东西是什么？（多选）", options: ["排骨", "虾", "红烧肉", "火锅"], answers: [0, 1], multi: true },
      { q: "最喜欢的女歌手是谁？", options: ["那英", "王菲", "邓紫棋", "孙燕姿"], answer: 1 },
      { q: "最讨厌的运动项目是什么？", options: ["游泳", "篮球", "跑步", "羽毛球"], answer: 2 },
      { q: "最喜欢的颜色是什么？", options: ["红色", "蓝色", "绿色", "黑色"], answer: 1 },
      { q: "最常说的一句话是什么？", options: ["好家伙", "绝绝子", "啥也不是", "芭比Q了"], answer: 2 },
      { q: "最喜欢的季节是哪个？", options: ["春天", "夏天", "秋天", "冬天"], anyCorrect: true }
    ];
    // 头像切图 face1-4.png 轮换；开场 start.*；线索 clue.*

    let current = 0;
    let selected = [];
    const card = document.getElementById("card");
    const LETTERS = ["A", "B", "C", "D"];
    const FACES = ["face1.png", "face2.png", "face3.png", "face4.png"];
    const CONFETTI = '<i class="cf cf1"></i><i class="cf cf2"></i><i class="cf cf3"></i><i class="cf cf4"></i>' +
                     '<i class="cf cf5"></i><i class="cf cf6"></i><i class="cf cf7"></i><i class="cf cf8"></i>';
    function setAvatar() {
      const a = document.getElementById("avatar");
      if (!a) return;
      a.onerror = function () { a.style.visibility = "hidden"; };
      a.src = FACES[current % FACES.length];
    }

    function setImgWithFallback(img, candidates) {
      let idx = 0;
      img.onerror = function () { idx++; if (idx < candidates.length) img.src = candidates[idx]; };
      img.src = candidates[0];
    }

    function renderStart() {
      card.innerHTML =
        '<div class="start">' +
          '<img class="start-bg-img" id="startImg" alt="" />' +
          '<div class="start-overlay">' +
            '<button class="start-btn" id="startBtn">开启解密之旅</button>' +
          '</div>' +
        '</div>';
      setImgWithFallback(document.getElementById("startImg"), ["start.jpg", "start.jpeg", "start.png"]);
      document.getElementById("startBtn").addEventListener("click", function () {
        current = 0;
        renderQuestion();
      });
    }
    function renderQuestion() {
      const item = QUESTIONS[current];
      selected = [];
      let html = '<div class="q-screen">' + CONFETTI;
      html += '<div class="card-wrap">';
      html += '<div class="avatar-ring"><img class="avatar-img" id="avatar" alt="" /></div>';
      html += '<div class="card">';
      html += '<div class="progress">第 ' + (current + 1) + ' 题 / 共 ' + QUESTIONS.length + ' 题</div>';
      html += '<div class="question">' + item.q + '</div>';
      if (item.multi) html += '<div class="hint">这道是多选，可以选多个</div>';
      html += '<div class="options">';
      item.options.forEach(function (opt, i) {
        html += '<button class="option" data-i="' + i + '">' + opt + '</button>';
      });
      html += '</div>';
      html += '<button class="submit-btn" id="submitBtn">确认答案</button>';
      html += '<div class="tip" id="tip"></div>';
      html += '<div class="nav" id="nav"></div>';
      html += '</div></div></div>';
      card.innerHTML = html;
      setAvatar();

      card.querySelectorAll(".option").forEach(function (btn) {
        btn.addEventListener("click", function () { onOption(parseInt(btn.dataset.i, 10)); });
      });
      document.getElementById("submitBtn").addEventListener("click", checkAnswer);
    }

    function onOption(i) {
      const item = QUESTIONS[current];
      const buttons = card.querySelectorAll(".option");
      if (item.multi) {
        const pos = selected.indexOf(i);
        if (pos >= 0) { selected.splice(pos, 1); buttons[i].classList.remove("selected"); }
        else { selected.push(i); buttons[i].classList.add("selected"); }
      } else {
        selected = [i];
        buttons.forEach(function (b, j) { b.classList.toggle("selected", j === i); });
      }
    }
    function checkAnswer() {
      const item = QUESTIONS[current];
      const buttons = card.querySelectorAll(".option");
      const tip = document.getElementById("tip");
      if (selected.length === 0) { tip.textContent = "请先选择一个答案～"; return; }
      let correct;
      if (item.anyCorrect) correct = true;
      else if (item.multi) correct = item.answers.slice().sort().join(",") === selected.slice().sort().join(",");
      else correct = selected[0] === item.answer;
      if (correct) {
        buttons.forEach(function (b) { b.classList.add("disabled"); });
        selected.forEach(function (i) { buttons[i].classList.remove("selected"); buttons[i].classList.add("correct"); });
        document.getElementById("submitBtn").style.display = "none";
        tip.textContent = "答对了！";
        renderNav();
      } else {
        selected.forEach(function (i) { buttons[i].classList.add("wrong"); });
        tip.textContent = "不对哦，再想想～";
        setTimeout(function () {
          buttons.forEach(function (b) { b.classList.remove("wrong", "selected"); });
          selected = [];
          tip.textContent = "";
        }, 1000);
      }
    }
    function renderNav() {
      const nav = document.getElementById("nav");
      let html = "";
      if (current > 0) html += '<button class="nav-btn back" id="backBtn">← 上一题</button>';
      else html += '<span></span>';
      html += '<button class="nav-btn next" id="goBtn">' +
              ((current + 1 < QUESTIONS.length) ? "下一题" : "揭晓线索") + '</button>';
      nav.innerHTML = html;
      if (current > 0) document.getElementById("backBtn").addEventListener("click", goBack);
      document.getElementById("goBtn").addEventListener("click", goNext);
    }

    function goBack() { if (current > 0) { current--; renderQuestion(); } }

    function goNext() {
      current++;
      if (current < QUESTIONS.length) renderQuestion();
      else renderClue();
    }

    function renderClue() {
      card.innerHTML =
        '<div class="clue">' +
          '<div class="emoji">🎉</div>' +
          '<h2>全部答对啦！这是最后的线索</h2>' +
          '<img id="clueImg" class="clue-img" alt="线索" />' +
        '</div>';
      setImgWithFallback(document.getElementById("clueImg"), ["clue.jpg", "clue.jpeg", "clue.png"]);
    }

    renderStart();
  </script>
</body>
</html>
