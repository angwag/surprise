<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>趣味知识答题</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #6a8dff 0%, #8b5cf6 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 34px 22px;
    min-height: 100%;
  }
  .wrap { width: 100%; max-width: 440px; margin: 0 auto; }
  .progress {
    font-size: 14px;
    color: rgba(255,255,255,0.85);
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-bottom: 18px;
    text-align: center;
  }
  .question {
    font-size: 28px;
    font-weight: 800;
    line-height: 1.45;
    color: #fff;
    margin-bottom: 30px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.12);
    text-align: center;
  }
  .options { display: flex; flex-direction: column; gap: 14px; }
  .option {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    text-align: left;
    padding: 16px 18px;
    font-size: 17px;
    color: #1f2937;
    border: none;
    border-radius: 16px;
    background: rgba(255,255,255,0.96);
    box-shadow: 0 6px 16px rgba(0,0,0,0.12);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .option:active { transform: scale(0.98); }
  .option .label {
    flex: 0 0 30px;
    height: 30px;
    border-radius: 50%;
    background: #ede9fe;
    color: #7c3aed;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }
  .option.correct { background: #f0fdf4; box-shadow: 0 0 0 2px #22c55e; }
  .option.correct .label { background: #22c55e; color: #fff; }
  .option.wrong { background: #fef2f2; box-shadow: 0 0 0 2px #ef4444; }
  .option.wrong .label { background: #ef4444; color: #fff; }
  .option.disabled { pointer-events: none; }
  .option.selected { background: #ede9fe; box-shadow: 0 0 0 2px #7c3aed; }
  .option.selected .label { background: #7c3aed; color: #fff; }
  .hint { font-size: 13px; color: rgba(255,255,255,0.85); margin: -16px 0 22px; text-align: center; }
  .submit-btn {
    margin-top: 18px;
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 800;
    color: #7c3aed;
    background: rgba(255,255,255,0.96);
    border: none;
    border-radius: 16px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,0.12);
  }
  .submit-btn:active { opacity: 0.9; }
  .tip {
    margin-top: 20px;
    min-height: 24px;
    font-size: 16px;
    font-weight: 700;
    text-align: center;
    color: #fff;
  }
  .next-btn {
    margin-top: 20px;
    width: 100%;
    padding: 15px;
    font-size: 17px;
    font-weight: 800;
    color: #7c3aed;
    background: #fff;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    display: none;
    box-shadow: 0 6px 16px rgba(0,0,0,0.15);
  }
  .next-btn:active { opacity: 0.9; }
  .clue { text-align: center; }
  .clue .emoji { font-size: 50px; margin-bottom: 12px; }
  .clue h2 { font-size: 22px; margin-bottom: 20px; color: #fff; }
  .clue .clue-text {
    font-size: 23px;
    font-weight: 800;
    line-height: 1.6;
    padding: 24px 18px;
    background: rgba(255,255,255,0.96);
    border-radius: 18px;
    color: #7c3aed;
    box-shadow: 0 10px 28px rgba(0,0,0,0.18);
  }
  .clue-img {
    width: 100%;
    max-width: 360px;
    border-radius: 18px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.18);
    display: block;
    margin: 0 auto;
  }
  .nav { margin-top: 20px; display: flex; gap: 12px; }
  .nav-btn {
    flex: 1;
    padding: 15px;
    font-size: 16px;
    font-weight: 800;
    border: none;
    border-radius: 16px;
    cursor: pointer;
  }
  .nav-btn:active { opacity: 0.9; }
  .nav-btn.next { color: #7c3aed; background: #fff; box-shadow: 0 6px 16px rgba(0,0,0,0.15); }
  .nav-btn.back { color: #fff; background: rgba(255,255,255,0.18); border: 2px solid rgba(255,255,255,0.65); }
  .start { position: fixed; inset: 0; }
  .start-bg-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .start-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .start-btn {
    padding: 18px 36px;
    font-size: 20px;
    font-weight: 800;
    color: #fff;
    background: linear-gradient(135deg, #6a8dff, #8b5cf6);
    border: none;
    border-radius: 999px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.3);
    cursor: pointer;
  }
  .start-btn:active { transform: scale(0.97); }
</style>
</head>
<body>
  <div class="wrap" id="card"></div>

  <script>
    // ===== 题库（answer=单选正确项 0/1/2/3；answers=多选正确项数组；anyCorrect=选啥都对）=====
    const QUESTIONS = [
      { q: "你最高的爬升记录是多少？", options: ["865 米", "1367 米", "1980 米", "2450 米"], answer: 1 },
      { q: "你最爱吃的东西是什么？（多选）", options: ["排骨", "虾", "红烧肉", "火锅"], answers: [0, 1], multi: true },
      { q: "最喜欢的女歌手是谁？", options: ["那英", "王菲", "邓紫棋", "孙燕姿"], answer: 1 },
      { q: "最讨厌的运动项目是什么？", options: ["游泳", "篮球", "跑步", "羽毛球"], answer: 2 },
      { q: "最喜欢的颜色是什么？", options: ["红色", "蓝色", "绿色", "黑色"], answer: 1 },
      { q: "最常说的一句话是什么？", options: ["好家伙", "绝绝子", "啥也不是", "芭比Q了"], answer: 2 },
      { q: "最喜欢的季节是哪个？", options: ["春天", "夏天", "秋天", "冬天"], anyCorrect: true }
    ];
    // ===== 全部答对后显示的最终线索图片（文件名需为 clue.jpg / clue.png，和 index.html 放一起）=====
    // ===========================================================

    let current = 0;
    let selected = [];
    const card = document.getElementById("card");
    const LETTERS = ["A", "B", "C", "D"];
    function renderStart() {
      card.innerHTML =
        '<div class="start">' +
          '<img class="start-bg-img" id="startImg" alt="" />' +
          '<div class="start-overlay">' +
            '<button class="start-btn" id="startBtn">开启解密之旅</button>' +
          '</div>' +
        '</div>';
      setImgWithFallback(document.getElementById("startImg"), ["start.jpg", "start.jpeg", "start.png"]);
      document.getElementById("startBtn").addEventListener("click", function () {
        current = 0;
        renderQuestion();
      });
    }

    function setImgWithFallback(img, candidates) {
      let idx = 0;
      img.onerror = function () { idx++; if (idx < candidates.length) img.src = candidates[idx]; };
      img.src = candidates[0];
    }

    function renderQuestion() {
      const item = QUESTIONS[current];
      selected = [];
      let html = '<div class="progress">第 ' + (current + 1) + ' / ' + QUESTIONS.length + ' 题</div>';
      html += '<div class="question">' + item.q + '</div>';
      if (item.multi) html += '<div class="hint">这道是多选，可以选多个</div>';
      html += '<div class="options">';
      item.options.forEach(function (opt, i) {
        html += '<button class="option" data-i="' + i + '">' +
                  '<span class="label">' + LETTERS[i] + '</span>' +
                  '<span class="text">' + opt + '</span>' +
                '</button>';
      });
      html += '</div>';
      html += '<button class="submit-btn" id="submitBtn">确认答案</button>';
      html += '<div class="tip" id="tip"></div>';
      html += '<div class="nav" id="nav"></div>';
      card.innerHTML = html;

      card.querySelectorAll(".option").forEach(function (btn) {
        btn.addEventListener("click", function () { onOption(parseInt(btn.dataset.i, 10)); });
      });
      document.getElementById("submitBtn").addEventListener("click", checkAnswer);
    }

    function onOption(i) {
      const item = QUESTIONS[current];
      const buttons = card.querySelectorAll(".option");
      if (item.multi) {
        const pos = selected.indexOf(i);
        if (pos >= 0) { selected.splice(pos, 1); buttons[i].classList.remove("selected"); }
        else { selected.push(i); buttons[i].classList.add("selected"); }
      } else {
        selected = [i];
        buttons.forEach(function (b, j) { b.classList.toggle("selected", j === i); });
      }
    }
    function checkAnswer() {
      const item = QUESTIONS[current];
      const buttons = card.querySelectorAll(".option");
      const tip = document.getElementById("tip");
      if (selected.length === 0) {
        tip.textContent = "请先选择一个答案～";
        return;
      }
      let correct;
      if (item.anyCorrect) {
        correct = true;
      } else if (item.multi) {
        correct = item.answers.slice().sort().join(",") === selected.slice().sort().join(",");
      } else {
        correct = selected[0] === item.answer;
      }
      if (correct) {
        buttons.forEach(function (b) { b.classList.add("disabled"); });
        selected.forEach(function (i) {
          buttons[i].classList.remove("selected");
          buttons[i].classList.add("correct");
        });
        document.getElementById("submitBtn").style.display = "none";
        tip.textContent = "答对了！";
        renderNav();
      } else {
        selected.forEach(function (i) { buttons[i].classList.add("wrong"); });
        tip.textContent = "不对哦，再想想～";
        setTimeout(function () {
          buttons.forEach(function (b) { b.classList.remove("wrong", "selected"); });
          selected = [];
          tip.textContent = "";
        }, 1000);
      }
    }

    function renderNav() {
      const nav = document.getElementById("nav");
      let html = "";
      if (current > 0) html += '<button class="nav-btn back" id="backBtn">返回上一题</button>';
      html += '<button class="nav-btn next" id="goBtn">' +
              ((current + 1 < QUESTIONS.length) ? "下一题" : "揭晓线索") + '</button>';
      nav.innerHTML = html;
      if (current > 0) document.getElementById("backBtn").addEventListener("click", goBack);
      document.getElementById("goBtn").addEventListener("click", goNext);
    }

    function goBack() {
      if (current > 0) { current--; renderQuestion(); }
    }
    function goNext() {
      current++;
      if (current < QUESTIONS.length) {
        renderQuestion();
      } else {
        renderClue();
      }
    }

    function renderClue() {
      card.innerHTML =
        '<div class="clue">' +
          '<div class="emoji">🎉</div>' +
          '<h2>全部答对啦！这是最后的线索</h2>' +
          '<img id="clueImg" class="clue-img" alt="线索" />' +
        '</div>';
      const candidates = ["clue.jpg", "clue.jpeg", "clue.png"];
      let idx = 0;
      const img = document.getElementById("clueImg");
      img.onerror = function () {
        idx++;
        if (idx < candidates.length) img.src = candidates[idx];
      };
      img.src = candidates[0];
    }

    renderStart();
  </script>
</body>
</html>
